<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hamroh</title>
<style>
:root{--bg:#1d2433;--fg:#eef1f7;--dim:#8b95ab;--bub:#f3efe6;--bubfg:#232a3b;--ok:#6fcf97;--off:#e07a7a}
@media (prefers-color-scheme:light){:root{--bg:#e9edf5;--fg:#1d2433;--dim:#667088;--bub:#232a3b;--bubfg:#f3efe6}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font:16px/1.4 "Trebuchet MS",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;overflow:hidden}
#shadow{position:absolute;left:0;top:0;height:12px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,0));opacity:0;pointer-events:none}
#pet{position:absolute;left:0;top:0;will-change:transform;touch-action:none;cursor:grab}
#pet:active{cursor:grabbing}
#flip{width:100%;height:100%;transform-origin:50% 50%}
#char{display:block;width:100%;height:100%;transform-origin:50% 100%;pointer-events:none;-webkit-user-drag:none;animation:breathe 4s ease-in-out infinite}
#char.talk{animation:talk .32s ease-in-out infinite}
#char.think{animation:breathe 1.6s ease-in-out infinite}
#char.still{animation:none}
#emoji{position:absolute;inset:0;display:grid;place-items:center;font-size:72px}
#emoji[hidden]{display:none}
@keyframes breathe{50%{transform:scaleY(1.012)}}
@keyframes talk{50%{transform:scaleY(1.02) translateY(-2px)}}
#bubble{position:absolute;left:0;top:0;max-width:min(280px,80vw);padding:12px 16px;border-radius:18px;background:var(--bub);color:var(--bubfg);font-size:16px;opacity:0;transition:opacity .25s;pointer-events:none}
#bubble.on{opacity:1}
#zz{position:absolute;left:0;top:0;font-weight:700;font-size:26px;color:var(--dim);opacity:0;pointer-events:none;animation:zz 2.4s ease-in-out infinite}
#zz.on{opacity:.9}
@keyframes zz{50%{margin-top:-10px}}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0;text-align:center;font-size:14px;color:var(--dim);pointer-events:none}
#dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--off);margin-right:6px}
#dot.ok{background:var(--ok)}
#diag{font-size:12px;min-height:16px;margin-top:2px}
#setup{display:none;position:fixed;left:16px;right:16px;top:30%;text-align:center;color:var(--dim)}
#safe{position:fixed;left:0;bottom:0;width:0;height:env(safe-area-inset-bottom,0px);pointer-events:none}
@media (prefers-reduced-motion:reduce){#char,#char.talk,#char.think,#zz{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="shadow"></div>
  <div id="pet"><div id="flip"><img id="char" alt="" draggable="false"><div id="emoji" hidden>🙂</div></div></div>
  <div id="bubble" aria-live="polite"></div>
  <div id="zz">z<small>z</small></div>
</div>
<div id="hud"><span id="dot"></span><span id="who">…</span><div id="diag"></div></div>
<p id="setup">Kalit yo'q. Sahifani shunday oching: <code>…/anim/#k=KALIT&amp;s=https://servis.onrender.com&amp;b=reze</code></p>
<div id="safe"></div>
<script>
/* ===== Sozlamalar (rasmlar o'zgarsa shu yerni tahrirlang) =====
   Pozalar: img/<bot>/<nom>.png. f = rasm qaysi tomonga qaragan ("L" chap, "R" o'ng),
   w,h = rasmning asl o'lchami, k = o'lcham koeffitsiyenti (boshqa pozalarga nisbatan tana kattaligi). */
const POSE={
  yurish1:{f:"L",k:1,w:677,h:1211}, yurish2:{f:"L",k:1,w:636,h:1211},
  ot:{f:"L",k:.6,w:1115,h:990},     ilash:{f:"R",k:.92,w:406,h:1228},
  osil:{f:"R",k:.95,w:281,h:1217},  yiqil:{f:"R",k:.65,w:1080,h:1127},
  uxla:{f:"R",k:.6,w:595,h:1163}
};
const STAND={f:"L",k:1,w:500,h:1260,m:10};               // idle/hayron/xafa/sevinch (turgan holat, yuz ifodasi)
const AVAIL=["idle","hayron","xafa","sevinch"];          // yangi hissiyot rasmi qo'shilsa nomini shu yerga yozing
const ALIAS={kulgi:"sevinch","ma'qullash":"sevinch",salomlashish:"sevinch","yig'lash":"xafa"};
const EMO={sevinch:"😊",kulgi:"😂",erkalash:"🥰",xafa:"😔","yig'lash":"😢",jahl:"😠",hayron:"😮",uyqu:"😴",uyalish:"🫣","ma'qullash":"👍",salomlashish:"👋","o'ylash":"🤔",boshqa:"🙂",idle:"🙂"};
const POLL_MS=2000, BUBBLE_MS=5000, EMO_MS=7000, SLEEP_AFTER=90000;
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;

const $=id=>document.getElementById(id);
const pet=$("pet"), flip=$("flip"), img=$("char"), emo=$("emoji"), bubble=$("bubble"), zz=$("zz"), safe=$("safe");
const rand=(a,b)=>a+Math.random()*(b-a);
const fname=e=>e.replace(/'/g,"");
function pickImg(e){ if(AVAIL.includes(fname(e))) return fname(e); const a=ALIAS[e]; return a&&AVAIL.includes(a)?a:"idle"; }

/* ===== Kalit va bot (URL # qismidan, keyin manzildan o'chiriladi) ===== */
let key="", server="", bot="reze", since=null, fails=0;
try{
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("k")) localStorage.setItem("anim_k",h.get("k"));
  if(h.get("b")) localStorage.setItem("anim_b",h.get("b").toLowerCase());
  if(h.get("s")) localStorage.setItem("anim_s",h.get("s").replace(/\/+$/,""));
  if(location.hash) history.replaceState(null,"",location.pathname+location.search);
  key=localStorage.getItem("anim_k")||""; server=localStorage.getItem("anim_s")||"";
  bot=localStorage.getItem("anim_b")||"reze";
}catch(e){}
if(!key||!server) $("setup").style.display="block";

/* ===== O'lcham va rasm ===== */
let U=.24, W=0, H=0, FY=0, href=300;
function measure(){
  W=innerWidth; H=innerHeight; href=Math.max(180,Math.min(300,H*.38)); U=href/1238;
  FY=H-safe.offsetHeight-4;
}
function dims(k){ const d=POSE[k]||STAND; return {w:d.w*d.k*U,h:d.h*d.k*U,f:d.f,m:(d.m||0)*d.k*U}; }
function preload(){ AVAIL.concat(Object.keys(POSE)).forEach(n=>{ new Image().src="img/"+bot+"/"+n+".png"; }); }
let curKey="", cd=null;
function setKey(k){
  if(k!==curKey){
    curKey=k;
    img.onerror=()=>{ if(k!=="idle"){ setKey("idle"); } else { img.style.display="none"; emo.hidden=false; $("diag").textContent="Rasm topilmadi: img/"+bot+"/idle.png (papka yuklanganmi?)"; } };
    img.onload=()=>{ img.style.display=""; emo.hidden=true; };
    img.src="img/"+bot+"/"+k+".png";
  }
  cd=dims(k);
}

/* ===== Holat mashinasi ===== */
const HAPPY=["sevinch","kulgi","erkalash","salomlashish","ma'qullash"];
const P={x:0,y:0,vx:0,vy:0,vw:0,dir:-1,st:"stand",t:3,phase:0,bob:0,held:false,
  rot:0,rv:0,sy:{x:1,v:0},fs:1,lf:"L",lh:false,hy:0,hop:null,hops:0,hopH:0,
  mode:"up",pause:0,tt:0,run:false,stopping:false,bounces:0,
  emo:"idle",emoUntil:0,lock:0,talkUntil:0,think:false,lastEv:performance.now()};
let drag=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const spring=dt=>{ const s=P.sy; s.v+=((1-s.x)*300-s.v*18)*dt; s.x+=s.v*dt; };   // siqilish/cho'zilish prujinasi
const cancelHop=()=>{ P.hop=null; P.hops=0; P.hy=0; };

function toStand(){ if(P.st==="sit") P.sy.x=1.07; P.st="stand"; P.t=rand(2,5); P.bob=0; P.vw=0; P.stopping=false; zz.classList.remove("on"); }
function startWalk(){
  cancelHop(); P.dir=P.x<W*.2?1:P.x>W*.8?-1:(Math.random()<.5?-1:1);
  P.st="walk"; P.t=rand(3,7); P.phase=0; P.vw=0; P.stopping=false; P.run=!RM&&Math.random()<.22; P.sy.x=.94;
}
function startSit(t){ cancelHop(); P.st="sit"; P.t=t||rand(4,9); P.bob=0; P.vw=0; P.sy.x=.88; P.dir=Math.random()<.5?-1:1; setKey("ot"); }
function startSleep(){ cancelHop(); P.st="sleep"; P.bob=0; P.vw=0; setKey("uxla"); zz.classList.add("on"); }
function startClimb(side){ cancelHop(); P.st="climb"; P.dir=side; P.t=rand(2.5,4.5); P.mode="up"; P.pause=0; P.tt=0; P.vy=0; P.bob=0; P.vw=0; setKey("ilash"); }
function startFall(vx,vy){ cancelHop(); P.st="fall"; P.vy=vy||0; P.vx=vx||0; P.tt=0; P.bounces=0; P.bob=0; if(vx) P.dir=vx>0?1:-1; setKey("yiqil"); }
function startHop(){ P.hop={t:0,d:.36,h:P.hopH||href*.085}; P.sy.x=.88; }
function hitWall(side){
  P.x=side>0?W-cd.w/2:cd.w/2;
  if(!RM&&Math.random()<.35) startClimb(side); else P.dir=-side;
}
function land(){
  const v=P.vy; P.y=FY; P.vx=0;
  if(v>href*1.2&&P.bounces<1){ P.bounces++; P.vy=-v*.3; P.sy.x=.8; return; }
  P.vy=0; P.bounces=0; P.sy.x=1-Math.min(.28,v/(href*9));
  if(v>href*1.2) startSit(rand(1.5,3)); else toStand();
}
function nextAction(){
  const n=performance.now();
  if(n-P.lastEv>SLEEP_AFTER&&Math.random()<.5) return startSleep();
  const r=Math.random();
  if(RM||r>.85){ P.t=rand(2,4); return; }
  if(r>.75){ P.dir*=-1; P.t=rand(1.5,3); return; }      // atrofga qaraydi
  if(r<.5) startWalk(); else startSit();
}
function react(e,ms){
  const n=performance.now(); P.emo=e; P.emoUntil=n+ms; P.lock=n+ms;
  if(!RM){ if(HAPPY.includes(e)){ P.hops=2; P.hopH=href*.085; } else if(e==="hayron"){ P.hops=1; P.hopH=href*.12; } }
  if(P.st==="walk") P.stopping=true;
  else if(P.st==="sit"||P.st==="sleep") toStand();
  else if(P.st==="climb") startFall(0);
}
function poke(){ P.lastEv=performance.now(); react("hayron",1500); }

function update(dt,now){
  spring(dt);
  const tf=P.held?1:(cd.f==="L"?(P.dir>0?-1:1):(P.dir<0?-1:1));      // yuz yo'nalishi: burilish animatsiyasi
  if(cd.f!==P.lf||P.held!==P.lh){ P.lf=cd.f; P.lh=P.held; P.fs=tf; }
  P.fs+=(tf-P.fs)*Math.min(1,dt*16); if(Math.abs(tf-P.fs)<.02) P.fs=tf;
  if(P.held){                                                         // ushlab turilganda mayatnik kabi tebranadi
    if(drag){ drag.vx*=Math.pow(.05,dt); drag.vy*=Math.pow(.05,dt);
      const tgt=clamp(drag.vx*.022,-28,28); P.rv+=((tgt-P.rot)*70-P.rv*6)*dt; P.rot+=P.rv*dt; }
    return;
  }
  const SP=href*.36;
  switch(P.st){
    case "stand":
      P.y=FY; setKey(now<P.emoUntil?pickImg(P.emo):"idle"); P.rot*=Math.pow(.0005,dt);
      if(P.hop){
        const u=P.hop.t/P.hop.d; P.hop.t+=dt; P.hy=-P.hop.h*4*u*(1-u);
        if(P.hop.t>=P.hop.d){ P.hop=null; P.hy=0; P.sy.x=.86; P.hops--; }
      } else if(P.hops>0) startHop();
      else { P.t-=dt; if(P.t<=0&&now>P.lock) nextAction(); }
      break;
    case "walk":{
      P.y=FY;
      const tgt=P.stopping?0:P.dir*SP*(P.run?1.7:1);
      P.vw+=(tgt-P.vw)*Math.min(1,dt*(P.stopping?9:5));                // tezlanish va sekinlashish
      P.x+=P.vw*dt;
      const av=Math.abs(P.vw), f=Math.min(1,av/SP);
      P.phase+=av*dt/(href*.26);                                       // qadam masofaga bog'liq (sirpanish kamayadi)
      setKey(Math.floor(P.phase)%2?"yurish2":"yurish1");
      P.bob=-Math.abs(Math.sin(P.phase*Math.PI))*href*.014*f;
      P.rot=clamp(P.vw/SP*(P.run?3.5:2.2),-8,8)+Math.sin(P.phase*Math.PI)*.8*f;   // yurganda oldinga engashadi
      if(P.x-cd.w/2<=0){ hitWall(-1); break; } else if(P.x+cd.w/2>=W){ hitWall(1); break; }
      P.t-=dt; if(P.t<=0) P.stopping=true;
      if(P.stopping&&av<6) toStand();
      break; }
    case "sit": P.y=FY; P.rot*=Math.pow(.0005,dt); P.t-=dt; if(P.t<=0) toStand(); break;
    case "sleep": P.y=FY; P.rot*=Math.pow(.0005,dt); break;
    case "climb":
      P.x+=((P.dir>0?W-cd.w/2:cd.w/2)-P.x)*Math.min(1,dt*12); P.tt+=dt;
      P.rot=Math.sin(P.tt*4.5)*1.2;
      if(P.mode==="up"){                                               // qadam-baqadam chiqadi
        P.y-=href*.22*(.55+.9*Math.abs(Math.sin(P.tt*4.5)))*dt; P.t-=dt;
        if(P.y-cd.h<=H*.22) P.t=0;
        if(P.t<=0){ P.mode="hold"; P.pause=rand(.5,1); }
      } else if(P.mode==="hold"){
        P.pause-=dt;
        if(P.pause<=0){ if(Math.random()<.5){ P.mode="down"; P.vy=0; } else startFall(-P.dir*50); }
      } else {                                                         // sekin sirpanib tushadi
        P.vy=Math.min(P.vy+href*.5*dt,href*.9); P.y+=P.vy*dt;
        if(P.y>=FY){ P.y=FY; P.sy.x=.9; toStand(); }
      }
      break;
    case "fall":{
      P.tt+=dt; P.vy+=href*4*dt; P.y+=P.vy*dt; P.vx*=1-.5*dt; P.x+=P.vx*dt;
      const lo=cd.w/2, hi=W-cd.w/2;
      if(P.x<lo){ P.x=lo; P.vx=Math.abs(P.vx)*.5; } else if(P.x>hi){ P.x=hi; P.vx=-Math.abs(P.vx)*.5; }
      if(P.y-cd.h<0&&P.vy<0){ P.y=cd.h; P.vy=0; }
      P.rot+=(Math.sin(P.tt*7)*10-P.rot)*Math.min(1,dt*6);
      if(P.y>=FY&&P.vy>0) land();
      break; }
  }
  const cls=P.st==="stand"?(now<P.talkUntil?"talk":P.think?"think":RM?"still":""):"still";
  if(img.dataset.c!==cls){ img.dataset.c=cls; img.className=cls; }
}

const shadow=$("shadow");
let lw=0, lh=0, lo="", lsw=0;
function render(){
  if(cd.w!==lw||cd.h!==lh){ pet.style.width=cd.w+"px"; pet.style.height=cd.h+"px"; lw=cd.w; lh=cd.h; }
  const org=P.held?(HAND*100)+"% 0%":(P.st==="fall"?"50% 50%":"50% 100%");
  if(org!==lo){ flip.style.transformOrigin=org; lo=org; }
  const sy=P.sy.x, sx=1+(1-sy)*.7;
  flip.style.transform="rotate("+P.rot.toFixed(2)+"deg) scale("+(P.fs*sx).toFixed(3)+","+sy.toFixed(3)+")";
  const left=P.x-cd.w/2, top=P.y-cd.h+cd.m+P.bob+P.hy;
  pet.style.transform="translate3d("+left+"px,"+top+"px,0)";
  const sw=cd.w*(P.st==="sit"||P.st==="sleep"||P.st==="fall"?.7:.5);
  if(sw!==lsw){ shadow.style.width=sw+"px"; lsw=sw; }
  const air=Math.max(0,FY-P.y-P.hy);
  shadow.style.opacity=(P.st==="climb"||P.held)?0:(.32*Math.max(0,1-air/(href*1.1))).toFixed(3);
  shadow.style.transform="translate("+(P.x-sw/2)+"px,"+(FY-6)+"px)";
  if(bubble.classList.contains("on")){
    const bw=bubble.offsetWidth, bh=bubble.offsetHeight;
    const bx=Math.min(Math.max(P.x-bw/2,8),W-bw-8), by=Math.max(top-bh-10,44);
    bubble.style.transform="translate("+bx+"px,"+by+"px)";
  }
  if(P.st==="sleep") zz.style.transform="translate("+(P.x+cd.w*.1)+"px,"+(top-8)+"px)";
}
let last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000); last=t;
  update(dt,t); render(); requestAnimationFrame(loop);
}

/* ===== Sudrash: ushlab osiltirish (mayatnik), qo'yib yuborsa otiladi/yiqiladi, devor yonida yopishadi ===== */
const HAND=.59;   // osil rasmida qo'l kengligining qaysi qismida (0..1)
function hold(px,py){ P.x=px+(.5-HAND)*cd.w; P.y=py+cd.h-8; }
pet.addEventListener("pointerdown",e=>{
  e.preventDefault(); try{ pet.setPointerCapture(e.pointerId); }catch(_){}
  drag={x0:e.clientX,y0:e.clientY,lx:e.clientX,ly:e.clientY,lt:performance.now(),vx:0,vy:0,moved:false};
});
pet.addEventListener("pointermove",e=>{
  if(!drag) return;
  const n=performance.now();
  if(!drag.moved&&Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>6){
    drag.moved=true; cancelHop(); P.held=true; P.st="held"; P.rot=0; P.rv=0; P.vw=0; zz.classList.remove("on"); setKey("osil");
  }
  if(drag.moved){
    const dt=Math.max(.016,(n-drag.lt)/1000);
    drag.vx=drag.vx*.6+((e.clientX-drag.lx)/dt)*.4; drag.vy=drag.vy*.6+((e.clientY-drag.ly)/dt)*.4;
    drag.lx=e.clientX; drag.ly=e.clientY; drag.lt=n;
    hold(e.clientX,e.clientY);
  }
});
function endDrag(){
  if(!drag) return;
  const d=drag; drag=null;
  if(!d.moved){ poke(); return; }
  P.held=false;
  if(d.lx<40||d.lx>W-40) startClimb(d.lx<40?-1:1);                  // devor yonida qo'yib yuborilsa yopishadi
  else startFall(clamp(d.vx*.35,-350,350),clamp(d.vy*.35,-700,400));
}
pet.addEventListener("pointerup",endDrag);
pet.addEventListener("pointercancel",endDrag);

/* ===== Bot hodisalari ===== */
let tBub=0;
function say(text){
  clearTimeout(tBub);
  if(!text){ bubble.classList.remove("on"); return; }
  bubble.textContent=text; bubble.classList.add("on");
  tBub=setTimeout(()=>bubble.classList.remove("on"),BUBBLE_MS);
}
function who(n){
  if(!n) return; $("who").textContent=n;
  const b=n.toLowerCase(); if(b!==bot){ bot=b; curKey=""; preload(); }
}
function online(v){
  const w=$("who"); w.textContent=w.textContent.replace(/ \(oflayn\)$/,"")+(v?"":" (oflayn)");
  $("dot").className=v?"ok":"";
}
function diag(t){ $("diag").textContent=t||""; }
function play(ev){
  who(ev.bot); const n=performance.now(); P.lastEv=n;
  if(ev.kind==="typing"){ P.think=true; react("o'ylash",15000); return; }
  P.think=false;
  react(ev.emotion,Math.max(EMO_MS,ev.speak_ms||0)); say(ev.text);
  if(ev.speak_ms>0) P.talkUntil=n+Math.min(ev.speak_ms,12000);
}
async function poll(){
  if(!key||!server) return;
  try{
    const r=await fetch(server+"/anim?since="+(since||0),{headers:{"X-Anim-Secret":key},cache:"no-store"});
    if(r.status===403){ $("setup").style.display="block"; $("setup").textContent="Kalit noto'g'ri (Render'dagi ANIM_SECRET bilan bir xil bo'lsin)."; fails=99; online(false); diag("403: kalit mos emas"); return; }
    if(r.status===404){ online(false); diag("404: serverda ANIM_SECRET o'rnatilmagan yoki /anim yo'q (yangi kod deploy qilinmagan)"); fails=3; return; }
    if(!r.ok) throw new Error("HTTP "+r.status);
    let d; try{ d=await r.json(); }catch(e){ online(false); diag("Server /anim ni tanimadi: eski kod deploy qilingan"); fails=3; return; }
    fails=0; online(true); diag("");
    if(d.last<(since||0)) since=0;
    if(since===null){ since=d.last; if(d.events.length) who(d.events[d.events.length-1].bot); }
    else{ for(const ev of d.events){ play(ev); since=Math.max(since,ev.id); } }
  }catch(e){ if(++fails>=3){ online(false); diag("Ulanib bo'lmadi: server uxlayapti (1 daqiqa kuting), manzil (s=) xato yoki ANIM_ORIGIN mos emas. "+e.message); } }
}

/* ===== Ishga tushirish ===== */
measure(); preload(); setKey("idle");
P.x=W*.5; P.y=FY;
addEventListener("resize",()=>{ measure(); cd=dims(curKey); P.x=Math.min(Math.max(P.x,cd.w/2),Math.max(cd.w/2,W-cd.w/2)); if(["stand","walk","sit","sleep"].includes(P.st)) P.y=FY; });
requestAnimationFrame(t=>{ last=t; loop(t); });
poll(); setInterval(()=>{ if(fails<99) poll(); },POLL_MS);
/* sinov uchun (brauzer konsoli): anim_test("sevinch","Salom!") */
window.anim_test=(e,t)=>play({bot:bot,kind:"reply",emotion:e,text:t||"",speak_ms:(t||"").length*60});
</script>
</body>
</html>
